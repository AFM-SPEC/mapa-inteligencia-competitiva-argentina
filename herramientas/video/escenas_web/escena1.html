<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escena 1 · Apertura</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0b1d3a;
    color: #fff8dc;
    font-family: 'Libre Franklin', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 3.5rem 1.5rem 4rem 1.5rem;
  }

  /* Fondo de mapa interactivo animado */
  canvas#fondo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0.55;
  }

  .contenido {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-box {
    margin-bottom: 1.2rem;
    animation: fadeInDown 1.2s ease-out forwards;
  }
  .logo-box img {
    height: 38px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
  }

  .badge {
    display: inline-block;
    padding: 0.35rem 0.9rem;
    background: rgba(255, 248, 220, 0.12);
    border: 1px solid rgba(255, 248, 220, 0.35);
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff8dc;
    margin-bottom: 1.2rem;
    animation: fadeIn 1.5s ease-out forwards;
  }

  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 2.1rem;
    font-weight: 600;
    line-height: 1.18;
    color: #ffffff;
    margin-bottom: 1rem;
    text-shadow: 0 3px 12px rgba(0,0,0,0.5);
    animation: fadeInUp 1.2s ease-out forwards;
  }

  .cifra-destacada {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: rgba(11, 29, 58, 0.85);
    border: 1px solid rgba(255, 248, 220, 0.3);
    padding: 0.75rem 1.2rem;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    margin-top: 0.8rem;
    animation: fadeInUp 1.6s ease-out forwards;
  }

  .numero {
    font-size: 1.9rem;
    font-weight: 700;
    color: #ffd875;
    font-feature-settings: "tnum";
  }

  .etiqueta {
    font-size: 0.85rem;
    line-height: 1.25;
    text-align: left;
    color: #f1ebd6;
  }

  /* Subtítulo grande inferior */
  .subtitulo-contenedor {
    position: relative;
    z-index: 20;
    width: 100%;
    max-width: 370px;
    animation: fadeIn 1.8s ease-out forwards;
  }

  .subtitulo-barra {
    background: rgba(6, 17, 34, 0.94);
    border: 1.5px solid rgba(255, 248, 220, 0.4);
    border-radius: 14px;
    padding: 0.85rem 1rem;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }

  .subtitulo-texto {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.35;
    color: #fff8dc;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="fondo"></canvas>

<div class="contenido">
  <div class="logo-box">
    <img src="../../../docs/assets/neeti-logo.png" alt="NEETI">
  </div>
  <div class="badge">Datos abiertos del INDEC y del IGN</div>
  <h1>Mapa de inteligencia competitiva</h1>
  <div class="cifra-destacada">
    <div class="numero">2.314</div>
    <div class="etiqueta">gobiernos locales<br>de la Argentina</div>
  </div>
</div>

<script>
  // Animación de partículas de Argentina y líneas de rutas
  const canvas = document.getElementById('fondo');
  const ctx = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth * 2;
    h = canvas.height = window.innerHeight * 2;
  }
  resize();
  window.addEventListener('resize', resize);

  // Generar puntos simulando la silueta geográfica de Argentina
  const puntos = [];
  const numPuntos = 160;

  for (let i = 0; i < numPuntos; i++) {
    // Proporciones aproximadas de Argentina
    let latRel = Math.random(); // 0 norte, 1 sur
    let ancho = 0.5 - 0.35 * latRel; // más ancha al norte, más angosta al sur
    let lonRel = 0.5 + (Math.random() - 0.5) * ancho;

    puntos.push({
      x: (0.25 + lonRel * 0.5) * w,
      y: (0.15 + latRel * 0.72) * h,
      r: Math.random() * 2.5 + 1.2,
      pulso: Math.random() * Math.PI * 2,
      v: 0.02 + Math.random() * 0.03
    });
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);

    // Dibujar conexiones (rutas)
    ctx.strokeStyle = "rgba(255, 248, 220, 0.07)";
    ctx.lineWidth = 1.2;
    for (let i = 0; i < puntos.length; i++) {
      for (let j = i + 1; j < puntos.length; j++) {
        const dx = puntos[i].x - puntos[j].x;
        const dy = puntos[i].y - puntos[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < w * 0.16) {
          ctx.beginPath();
          ctx.moveTo(puntos[i].x, puntos[i].y);
          ctx.lineTo(puntos[j].x, puntos[j].y);
          ctx.stroke();
        }
      }
    }

    // Dibujar nodos (gobiernos locales)
    for (let p of puntos) {
      p.pulso += p.v;
      let alpha = 0.4 + 0.45 * Math.sin(p.pulso);
      ctx.fillStyle = `rgba(255, 224, 130, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 + 0.2 * Math.sin(p.pulso)), 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
